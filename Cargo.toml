[package]
name = "kdbx"
version = "0.14.0"
authors = ["Danil Akhtarov <daxartio@gmail.com>"]
edition = "2024"
description = "A secure hole for your passwords (Keepass CLI)"
documentation = "https://github.com/daxartio/kdbx"
homepage = "https://github.com/daxartio/kdbx"
repository = "https://github.com/daxartio/kdbx"
readme = "README.md"
keywords = ["keepass", "kdbx4", "password", "kdbx"]
categories = ["command-line-utilities"]
license = "MIT"

[features]
default = ["clipboard"]
clipboard = ["dep:arboard"]

[dependencies]
arboard = { version = "3.7", default-features = false, optional = true }
clap = { version = "4.6", features = ["derive", "env"] }
clap_complete = "4.6"
ctrlc = { version = "3.5", features = ["termination"] }
env_logger = "0.11"
human-panic = "2.0"
keepass = { version = "0.17", features = ["save_kdbx4", "totp"] }

url = "2.5"
libc = "0.2"
log = { version = "0.4", features = ["max_level_trace", "release_max_level_warn"] }
once_cell = "1.21"
tempfile = "3.27"
regex = "1.13"
hex = "0.4"
zeroize = "1.9"

[target.'cfg(not(windows))'.dependencies]
skim = { version = "5.9", default-features = false }

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
rstest = "0.28"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
